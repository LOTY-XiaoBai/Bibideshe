# 服务端口
server.port=${SERVER_PORT:8080}

# 本地开发时自动读取后端目录或项目根目录下的 .env。
# 文件不存在时不影响容器/生产环境，真实环境变量仍具有更高优先级。
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# 数据库连接 (通过环境变量注入, 勿在仓库中明文写生产密码)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bishe}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:bishe_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis (验证码、登录失败锁定等短时状态)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=3s

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Spring Boot Banner
spring.main.banner-mode=off

# 文件上传
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-mb=10

# Token 签名密钥（必填，不少于32字符；缺失时应用拒绝启动）
app.token.secret=${TOKEN_SECRET:}

# 允许的前端来源，多个用英文逗号分隔，禁止配置 *
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost}

# 自动化测试时可设 CAPTCHA_EXPOSE_CODE=true，使 /api/captcha 返回明文验证码；生产务必 false
app.captcha.expose-code=${CAPTCHA_EXPOSE_CODE:false}

# springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# 日志
logging.level.root=INFO
logging.level.com.example.bishe=DEBUG
logging.level.org.springframework.web=INFO
logging.file.name=${LOG_FILE:logs/bishe.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n
